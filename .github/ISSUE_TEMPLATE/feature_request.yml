name: Feature request
description: Propose a focused addition that fits capacitor-device-profile's device-glue scope.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What recurring device, safe-area, lifecycle or haptics problem cannot be solved cleanly with the current API?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      description: Show a small usage example and explain why it belongs here rather than application code.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds and compatibility implications.
    validations:
      required: true
