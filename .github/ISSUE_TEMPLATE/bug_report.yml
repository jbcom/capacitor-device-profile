name: Bug report
description: Report reproducible incorrect behavior in capacitor-device-profile.
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities, use the private reporting link in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest runnable code sample, the viewport facts or device involved, and exact commands.
      render: ts
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "capacitor-device-profile, Capacitor plugins, Node.js, package manager, device or browser, and operating system."
      placeholder: "capacitor-device-profile 0.1.1; Capacitor 8; Node 26; pnpm 12; OnePlus Open, Chrome 154"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add stack traces, viewport and safe-area numbers, or other useful details.
